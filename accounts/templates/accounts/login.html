{% extends 'base.html' %}
{% block title %}Sign In – CDAVP Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-6 col-lg-5">
    <div class="card-custom">
      <div class="card-custom-header bg-light">
        <h5 class="card-custom-title">
          <i class="fa-solid fa-right-to-bracket text-primary"></i> Portal Sign In
        </h5>
        <span class="badge bg-secondary">CDAVP</span>
      </div>
      <div class="card-custom-body p-4">

        <!-- DEMO TEST CREDENTIALS -->
        <div class="p-3 bg-light rounded-3 border mb-3 small">
          <div class="fw-bold text-dark mb-1"><i class="fa-solid fa-key text-warning me-1"></i> Quick Demo Logins:</div>
          <div class="d-flex flex-column gap-1">
            <button type="button" class="btn btn-sm btn-outline-dark text-start py-1" onclick="document.getElementById('id_username').value='admin'; document.getElementById('id_password').value='Admin@2026';">
              <strong>Admin:</strong> admin / Admin@2026
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark text-start py-1" onclick="document.getElementById('id_username').value='officer1'; document.getElementById('id_password').value='Officer@2026';">
              <strong>Officer:</strong> officer1 / Officer@2026
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark text-start py-1" onclick="document.getElementById('id_username').value='citizen1'; document.getElementById('id_password').value='Citizen@2026';">
              <strong>Citizen:</strong> citizen1 / Citizen@2026
            </button>
          </div>
        </div>

        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted mb-1" for="id_username">Username</label>
            {{ form.username }}
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted mb-1" for="id_password">Password</label>
            {{ form.password }}
          </div>

          <button type="submit" class="btn-primary-custom w-100 py-2 justify-content-center">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top small text-muted">
          New user? <a href="{% url 'register' %}" class="fw-bold">Create Citizen Account with Email OTP</a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
